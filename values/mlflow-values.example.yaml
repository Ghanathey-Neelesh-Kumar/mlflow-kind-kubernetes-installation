# Example values for the Community Charts MLflow Helm chart.
# Replace <RDS_ENDPOINT> and create the referenced Kubernetes Secret first.
# Never commit real database credentials to this file.

backendStore:
  databaseMigration: true
  databaseConnectionCheck: true
  postgres:
    enabled: true
    host: "<RDS_ENDPOINT>"
    port: 5432
    database: "mlflow"
  existingDatabaseSecret:
    name: "mlflow-db-secret"
    usernameKey: "username"
    passwordKey: "password"
