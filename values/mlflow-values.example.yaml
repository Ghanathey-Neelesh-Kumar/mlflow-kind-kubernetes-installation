# Values for the Community Charts MLflow Helm chart.
# Replace the endpoint and password with the values from your own RDS setup.
# Do not commit the completed local file with real credentials.

backendStore:
  databaseMigration: true
  databaseConnectionCheck: true
  postgres:
    enabled: true
    host: "<RDS_ENDPOINT>"
    port: 5432
    database: "mlflow"
    user: "mlflow_user"
    password: "<YOUR_MLFLOW_PASSWORD>"
